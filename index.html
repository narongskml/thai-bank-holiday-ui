<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Thai Bank Holiday Calendar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/print.css" media="print">

    <!-- use version 0.20.3 -->
    <script type="text/javascript" src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <header class="no-print">
        <div class="header-container">
            <div class="logo-area">
                <img src="img/logo.png" alt="Logo" class="logo-img">
                <span class="check-mark">✔</span>
                <h1 data-i18n="mainTitle">Thai Bank Holiday Calendar</h1>
            </div>
            <div class="toolbar">
                <div class="input-group">
                    <label data-i18n="labelLang">Language:</label>
                    <select id="langSelect">
                        <option value="th" selected>ภาษาไทย (TH)</option>
                        <option value="en">English (EN)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label data-i18n="labelYear">Select year:</label>
                    <select id="yearSelect">
                        <option value="2025">2025</option>
                        <option value="2026" selected>2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
                <button id="btnGenerate" class="btn btn-blue" data-i18n="btnGenerate">สร้างปฏิทิน</button>
                <button id="btnExcel" class="btn btn-green" data-i18n="btnExcel">ส่งออก Excel</button>
                <button id="btnPDF" class="btn btn-info" data-i18n="btnPDF">ส่งออก PDF</button>
                <button id="btnICS" class="btn btn-info" data-i18n="btnICS">ส่งออก ICS</button>
                <button id="btnPrint" class="btn btn-gray" data-i18n="btnPrint">พิมพ์</button>
                <button id="btnClear" class="btn btn-red" data-i18n="btnClear">ล้างค่า</button>
            </div>
        </div>
    </header>

    <main id="mainContent">
        <h2 id="displayTitle">Thai Bank public Holiday</h2>
        <div class="layout-wrapper">
            <section id="calendarGrid" class="calendar-grid"></section>
            
            <aside class="sidebar">
                <h3 data-i18n="sidebarTitle">Holidays</h3>
                <div class="table-container">
                    <table id="holidayTable">
                        <thead>
                            <tr>
                                <th data-i18n="colDate">Date</th>
                                <th data-i18n="colName">Name</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </aside>
        </div>
        <div class="signature-bar">
            <span class="signature-title">T-LIVE-CODE</span>
            <a href="https://www.youtube.com/@t-live-code" target="_blank">https://www.youtube.com/@t-live-code</a>
        </div>
    </main>
    <div id="tooltip" class="custom-tooltip"></div>
    <script src="js/script.js"></script>
</body>
</html>
